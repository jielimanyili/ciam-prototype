# Render Blueprint — CIAM live-demo fallback (ADR-022).
# Deploy: render.com → New → Blueprint → point at github.com/jielimanyili/ciam-prototype.
# The three backends run on Render free tier; the SPA deploys separately (Vercel/Render static)
# with assets/config.json pointing at the *.onrender.com URLs these services get.
services:
  - type: web
    name: api-identity-jvm
    runtime: docker
    dockerfilePath: ./api-identity-jvm/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: OIDC_ISSUER
        value: https://jie-ciam.us.auth0.com/
      - key: OIDC_AUDIENCE
        value: https://api.ciam-prototype
    healthCheckPath: /health

  - type: web
    name: api-identity-python
    runtime: docker
    dockerfilePath: ./api-identity-python/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: OIDC_ISSUER
        value: https://jie-ciam.us.auth0.com/
      - key: OIDC_AUDIENCE
        value: https://api.ciam-prototype
    healthCheckPath: /health

  - type: web
    name: api-auth
    runtime: docker
    dockerfilePath: ./api-auth/Dockerfile
    dockerContext: ./api-auth
    plan: free
    envVars:
      - key: CIAM_AUTH_CLIENT_ID
        # Auth0's random Client ID for the api-auth app (not the display name).
        value: F1oCYtiQQUWc6OBt7CV89QjZ5gV5TXel
      - key: RESOURCE_SERVER_URL
        # BFF proxies /api/me + /api/claims to the JVM resource server. Must stay the PUBLIC
        # *.onrender.com URL: free-tier web services can't receive private-network traffic, so
        # Render's internal service-name DNS (http://api-identity-jvm) is NOT reachable here.
        value: https://api-identity-jvm.onrender.com
      - key: OIDC_ISSUER
        # BFF: no trailing slash — Spring's issuer-uri appends /.well-known/... and a slash 404s.
        value: https://jie-ciam.us.auth0.com
      - key: OIDC_AUDIENCE
        value: https://api.ciam-prototype
      - key: SAML_ENABLED
        # OIDC-only demo: don't fetch the (Keycloak-local) SAML IdP metadata at startup.
        value: "false"
      - key: CLIENT_SECRET
        sync: false
    healthCheckPath: /actuator/health

  # Static SPA (ADR-022) — build-live.sh writes the Auth0/Render config before the build.
  - type: web
    name: ui-identity
    runtime: static
    rootDir: ui-identity
    buildCommand: sh build-live.sh
    staticPublishPath: ./dist/ui-identity/browser