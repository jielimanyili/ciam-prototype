[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdk-identity-python"
version = "0.1.0"
description = "Reusable CIAM identity library — OIDC discovery, PKCE (S256), client-credentials, scope/claim assertions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
