name: Deploy (AWS)

# ADR-018: GitHub Actions is the demo CI/CD. This is the "deploy (main only)" stage of the
# pipeline — build → push ECR → Terraform apply → S3/CloudFront. Non-main branches skip it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT: ciam
  ENVIRONMENT: demo

jobs:
  deploy:
    name: Build + deploy (ECS EC2 + S3/CloudFront)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Long-lived access keys — this account's SCP denies iam:CreateOpenIDConnectProvider,
      # so OIDC federation isn't available (see docs/RUNBOOK-AWS-OKTA.md §1.3).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Apply first so ECR/S3/ECS exist; images are pushed next and services are rolled after.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9'

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_oidc_issuer: ${{ vars.OIDC_ISSUER }}
          TF_VAR_api_auth_client_secret: ${{ secrets.OKTA_CLIENT_SECRET }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build + push api-identity-jvm
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api-identity-jvm/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-${{ env.ENVIRONMENT }}/api-identity-jvm:${{ github.sha }}

      - name: Build + push api-identity-python
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api-identity-python/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-${{ env.ENVIRONMENT }}/api-identity-python:${{ github.sha }}

      - name: Build + push api-auth
        uses: docker/build-push-action@v6
        with:
          context: api-auth
          file: api-auth/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-${{ env.ENVIRONMENT }}/api-auth:${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-identity/package-lock.json

      - name: Build SPA
        working-directory: ui-identity
        run: npm ci && npm run build

      - name: Deploy SPA to S3 + invalidate CloudFront
        env:
          BUCKET: ${{ env.PROJECT }}-${{ env.ENVIRONMENT }}-spa
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
        run: |
          # Runtime config for the deployed SPA: Okta authority + relative API path (CloudFront).
          cat > ui-identity/dist/ui-identity/browser/assets/config.json <<EOF
          {
            "authority": "${OIDC_ISSUER}",
            "apiBaseUrl": "/jvm"
          }
          EOF
          aws s3 sync ui-identity/dist/ui-identity/browser "s3://${BUCKET}" --delete
          DIST_ID=$(terraform -chdir=terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths "/*"

      - name: Roll ECS services to the new image
        run: |
          for svc in api-identity-jvm api-identity-python api-auth; do
            aws ecs update-service --cluster "${PROJECT}-${ENVIRONMENT}" \
              --service "$svc" --force-new-deployment --no-cli-pager > /dev/null
          done
