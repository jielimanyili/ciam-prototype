spring:
  application:
    name: api-auth
  security:
    oauth2:
      client:
        registration:
          ciam:
            client-id: api-auth
            # Injected from SSM Parameter Store on ECS (ADR-020); local fallback for dev.
            client-secret: ${CLIENT_SECRET:api-auth-secret}
            authorization-grant-type: authorization_code
            # Auth0 Regular Web Apps default to client_secret_post (Auth0 Dashboard → the app →
            # "Token Endpoint Authentication Method" = Post); Spring defaults to basic, so align them.
            client-authentication-method: client_secret_post
            scope: openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          ciam:
            # OIDC discovery (RFC 8414) — provider-agnostic (Keycloak locally, Auth0 in prod); the
            # authorize/token/jwks/userinfo endpoints resolve automatically. The BFF receives this
            # WITHOUT a trailing slash (Terraform trims it) because Spring appends the well-known
            # path and a trailing slash would 404 Auth0's discovery document.
            issuer-uri: ${OIDC_ISSUER:http://localhost:8080/realms/ciam-demo}
    # SAML 2.0 SP is configured in code (SamlConfig) — the IdP metadata is resolved there so it
    # can be toggled off for an OIDC-only deploy: set SAML_ENABLED=false (Epic 2).

# Downstream resource server the BFF proxies to (server-side token).
ciam:
  auth:
    resource-server-url: ${RESOURCE_SERVER_URL:http://localhost:4101}
    # API audience sent in the authorize request so the BFF's access token carries the right `aud`.
    audience: ${OIDC_AUDIENCE:}

server:
  port: ${PORT:4103}
  servlet:
    # Set to a path prefix (e.g. /auth) when fronted by CloudFront path-based routing.
    context-path: ${CONTEXT_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health
