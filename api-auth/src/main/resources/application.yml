spring:
  application:
    name: api-auth
  security:
    oauth2:
      client:
        registration:
          ciam:
            client-id: api-auth
            # Injected from AWS Secrets Manager on ECS (ADR-019); local fallback for dev.
            client-secret: ${CLIENT_SECRET:api-auth-secret}
            authorization-grant-type: authorization_code
            scope: openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          ciam:
            authorization-uri: ${OIDC_ISSUER:http://localhost:8080/realms/ciam-demo}/protocol/openid-connect/auth
            token-uri: ${OIDC_ISSUER:http://localhost:8080/realms/ciam-demo}/protocol/openid-connect/token
            jwk-set-uri: ${OIDC_ISSUER:http://localhost:8080/realms/ciam-demo}/protocol/openid-connect/certs
            user-info-uri: ${OIDC_ISSUER:http://localhost:8080/realms/ciam-demo}/protocol/openid-connect/userinfo
    # SAML 2.0 SP is configured in code (SamlConfig) — the IdP metadata is resolved there so it
    # can be toggled off for an OIDC-only deploy: set SAML_ENABLED=false (Epic 2).

# Downstream resource server the BFF proxies to (server-side token).
ciam:
  auth:
    resource-server-url: ${RESOURCE_SERVER_URL:http://localhost:4101}

server:
  port: ${PORT:4103}

management:
  endpoints:
    web:
      exposure:
        include: health
