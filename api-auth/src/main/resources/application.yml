spring:
  application:
    name: api-auth

# OIDC client registration is built in code (OidcClientConfig) from the values below — Auth0's
# trailing-slash `iss` breaks Spring's issuer-uri discovery (ADR-022), so endpoints are explicit.
# SAML 2.0 SP is configured in code (SamlConfig) — set SAML_ENABLED=false for OIDC-only deploys.
ciam:
  auth:
    client-id: ${CIAM_AUTH_CLIENT_ID:api-auth}
    # Injected from SSM Parameter Store on ECS (ADR-020) / Render secret; local fallback for dev.
    client-secret: ${CLIENT_SECRET:api-auth-secret}
    # Downstream resource server the BFF proxies to (server-side token).
    resource-server-url: ${RESOURCE_SERVER_URL:http://localhost:4101}
    # API audience sent in the authorize request so the BFF's access token carries the right `aud`.
    audience: ${OIDC_AUDIENCE:}
    # Auth0 issuer + endpoints (explicit; see OidcClientConfig / ADR-022).
    issuer: ${CIAM_AUTH_ISSUER:https://jie-ciam.us.auth0.com/}
    authorization-uri: ${CIAM_AUTH_AUTHORIZATION_URI:https://jie-ciam.us.auth0.com/authorize}
    token-uri: ${CIAM_AUTH_TOKEN_URI:https://jie-ciam.us.auth0.com/oauth/token}
    jwk-set-uri: ${CIAM_AUTH_JWKS_URI:https://jie-ciam.us.auth0.com/.well-known/jwks.json}
    user-info-uri: ${CIAM_AUTH_USERINFO_URI:https://jie-ciam.us.auth0.com/userinfo}

server:
  port: ${PORT:4103}
  servlet:
    # Set to a path prefix (e.g. /auth) when fronted by CloudFront path-based routing.
    context-path: ${CONTEXT_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health
