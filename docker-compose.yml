services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: ciam-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/ciam-realm.json:/opt/keycloak/data/import/ciam-realm.json:ro
