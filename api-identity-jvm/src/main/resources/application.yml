spring:
  application:
    name: api-identity-jvm

# CIAM identity — auto-configured by sdk-identity-jvm-spring-boot-starter (ADR-007).
ciam:
  identity:
    issuer-uri: ${OIDC_ISSUER:http://localhost:8080/realms/ciam-demo}
    audience: ${OIDC_AUDIENCE:api-identity-jvm}

server:
  port: ${PORT:4101}
  servlet:
    # Set to a path prefix (e.g. /jvm) when fronted by CloudFront path-based routing.
    context-path: ${CONTEXT_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health
